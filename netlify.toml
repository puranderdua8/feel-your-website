# Netlify build configuration.
#
# Lives at the repo root because this is a pnpm workspace: Netlify installs
# from the root lockfile, then builds only the shell.

[build]
  base = "/"
  publish = "apps/shell/dist/client"

  command = "pnpm turbo run build --filter=@feel-your-website/shell..."

[build.environment]
  NODE_VERSION = "22.13.0"
  # pnpm is pinned by package.json's `packageManager` field and enabled via
  # corepack; Netlify picks it up from there.
  NETLIFY_USE_PNPM = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The service worker must never be served stale, or a client can be pinned to
# an old version indefinitely — the one file where caching is actively
# harmful.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable by construction, so they can be cached
# hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
