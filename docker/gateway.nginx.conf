# The single origin the apps' `SUPABASE_URL` points at. @supabase/supabase-js
# and @supabase/ssr only ever call `${SUPABASE_URL}/auth/v1/*` and
# `${SUPABASE_URL}/rest/v1/*` in this codebase — no realtime, storage or edge
# functions — so this routes exactly those two prefixes and nothing else.
#
# The trailing slash on both `location` and `proxy_pass` strips the prefix:
# /auth/v1/token -> GoTrue /token, /rest/v1/rpc/x -> PostgREST /rpc/x.

server {
  listen 8000;
  server_name _;

  # GoTrue
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PostgREST
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # PostgREST reads the JWT and the apikey from these headers directly.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
  }

  location = / {
    return 200 "feel-your-website local supabase gateway\n";
    default_type text/plain;
  }
}
