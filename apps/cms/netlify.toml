# Netlify build configuration for the CMS's own site.
#
# Lives inside apps/cms/, not the repo root — deliberately, and not merely by
# convention. Netlify has a documented limitation where a repository-root
# netlify.toml is always used for every site pointed at that repo, and a
# nested one is never reached once a root file exists — confirmed the hard
# way here: with a root-level file present, this site's own "Package
# directory: apps/cms" setting alone did not stop Netlify from reading the
# root file and building/publishing apps/shell instead. See
# apps/shell/netlify.toml — that one used to be the repo-root file and moved
# for the same reason. Each site's dashboard needs "Package directory" set to
# its own app folder (apps/cms for this one) with no root-level file left to
# shadow it.
#
# `base = "/"` even so: this is still one pnpm workspace with one lockfile at
# the repo root, and `base` is what Netlify installs from and resolves this
# file's own relative paths against — not `apps/cms/`.

[build]
  base = "/"
  publish = "apps/cms/dist/client"

  command = "pnpm turbo run build --filter=@feel-your-website/cms..."

[build.environment]
  # Same reasoning as the root file: keep in sync with .nvmrc, not a second
  # place to drift, and >= 22.23.x for the corepack/pnpm signing-key fix.
  NETLIFY_USE_PNPM = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Defense in depth alongside the `<meta name="robots">` tag in
    # `src/routes/__root.tsx` — an authoring tool has no public audience, and
    # a header survives even a page that fails to render.
    X-Robots-Tag = "noindex, nofollow"

# Hashed build assets are immutable by construction, so they can be cached
# hard. No service-worker or manifest headers here — this app ships neither.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
