# Netlify build configuration for the shell's own site.
#
# Lives inside apps/shell/, not the repo root — see apps/cms/netlify.toml's
# own comment for why: Netlify has a documented limitation where a
# repository-root netlify.toml is always used for every site pointed at that
# repo, and a nested one (discovered via a site's own "Package directory"
# setting) is never reached once a root file exists. Two sites sharing this
# repo means neither can have a root-level netlify.toml — each needs the
# Netlify dashboard's "Package directory" set to its own app folder
# (apps/shell for this site) instead.
#
# `base = "/"` even so: this is still one pnpm workspace with one lockfile at
# the repo root, and `base` is what Netlify installs from and resolves this
# file's own relative paths against — not `apps/shell/`.

[build]
  base = "/"
  publish = "apps/shell/dist/client"

  command = "pnpm turbo run build --filter=@feel-your-website/shell..."

[build.environment]
  # Node version comes from .nvmrc — declaring it here too would be a second
  # place for the same fact to drift.
  #
  # It must stay >= 22.23.x: earlier 22.x ships corepack 0.30, whose npm
  # registry signing keys are stale, so corepack fails to verify pnpm with
  # "Cannot find matching keyid" and the install never starts.
  NETLIFY_USE_PNPM = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The service worker must never be served stale, or a client can be pinned to
# an old version indefinitely — the one file where caching is actively
# harmful.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable by construction, so they can be cached
# hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
